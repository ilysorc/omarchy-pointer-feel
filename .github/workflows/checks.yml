name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install reference-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake g++ libgtest-dev
      - name: Controller and installation transactions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build and test reference engines
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DPOINTER_FEEL_BUILD_PLUGIN=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 tests/check_mac_reference.py
      - name: Validate source distribution and provenance
        run: python3 tools/check_release.py

# Omarchy/QML and live Hyprland module checks run on a compatible desktop.
# Pull requests never run on the maintainer's personal self-hosted runners.
